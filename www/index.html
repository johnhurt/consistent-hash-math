<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Consistent Hashing Proofs</title>
  <style type="text/css">
    @property --viewport-width {
      syntax: '<length>';
      inherits: true;
      initial-value: 100vw;
    }

    #markdown-body {
      display: block;
      margin-left: auto;
      margin-right: auto;
      max-width: 620px;
      padding: 2%;
    }

    .katex-display {
      font-size: calc(min(var(--viewport-width) * 1em / 600px, 1em))
    }

    .diagram.small {
      height: calc(min(var(--viewport-width) * 0.9 * 100 / 600, 100px))
    }

    .diagram.tall {
      height: calc(min(var(--viewport-width) * 0.9 * 500 / 600, 500px))
    }

    .diagram-container {
      margin-bottom: 20px;
    }

    .diagram {
      margin-top: 10px;
    }

    img {
      margin: auto;
      display: block;
    }

    body {
      background-color: var(--bgColor-default);
    }

    #spinner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.2);
      z-index: 1000;
    }

    #spinner.active {
      display: flex;
    }

    .spinner-circle {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(128, 128, 128, 0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spinner-spin 1s linear infinite;
    }

    @keyframes spinner-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
  <div id="spinner" aria-hidden="true"><div class="spinner-circle"></div></div>
  <div id="initialized" />
  <article id="markdown-body" class="markdown-body" />

  <script src="./bootstrap.js"></script>
</body>

</html>
